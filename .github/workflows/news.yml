name: Refresh maritime news
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; free on GitHub, uses no Claude
  workflow_dispatch:
  push:
    paths:
      - tools/news.py
      - .github/workflows/news.yml
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/news.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then echo "No change"; exit 0; fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "News update"
          git pull --rebase -q origin main
          git push
